server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El HTML apunta a bundles con hash. No debe quedar cacheado entre deploys,
    # o el navegador puede seguir importando el bundle anterior.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }
}
